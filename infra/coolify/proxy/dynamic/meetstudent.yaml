# MeetStudent's shared proxy protections, for Coolify's Traefik (file provider).
#
# Install on the server as /data/coolify/proxy/dynamic/meetstudent.yaml (Servers ->
# Proxy -> Dynamic configurations in the Coolify UI); Traefik reloads it live.
# compose.coolify.yml references each middleware as <name>@file. They live here,
# not as labels on an app container, because labels vanish for every router as
# soon as that container stops. Same values as the labels of compose.prod.yml's
# traefik service: change both together.
http:
  middlewares:
    sec:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"
        # frame-ancestors only: a full CSP is deliberately omitted, see docs/DEPLOY.md.
        contentSecurityPolicy: "frame-ancestors 'none'"

    # Drops the RFC 7239 Forwarded request header (an empty value removes a header). Traefik sets
    # X-Forwarded-* itself but would pass a client-sent Forwarded through, and Spring's forwarded-header
    # filter would then take the client address from it. Attached to every router that reaches the api.
    strip-forwarded:
      headers:
        customRequestHeaders:
          Forwarded: ""

    # Brute-force guard for login/refresh/register: 10 req/min per client IP.
    rl-auth:
      rateLimit:
        average: 10
        period: 1m
        burst: 5

    # Loose general guard for the rest of the API.
    rl-api:
      rateLimit:
        average: 30
        period: 1s
        burst: 100

    # 10 MB cap on uploads (matches the API's own multipart limit).
    upload-limit:
      buffering:
        maxRequestBodyBytes: 10485760
        memRequestBodyBytes: 1048576

    # Used by the plain-HTTP routers of compose.coolify.yml. Not named
    # redirect-to-https: Coolify's own dynamic file may already define that name.
    https-redirect:
      redirectScheme:
        scheme: https
        permanent: true
