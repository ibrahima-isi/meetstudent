# MeetStudent's shared proxy protections, for Coolify's Traefik (file provider).
#
# Install on the server as /data/coolify/proxy/dynamic/meetstudent.yaml (Servers ->
# Proxy -> Dynamic configurations in the Coolify UI); Traefik reloads it live.
# compose.coolify.yml references each middleware as <name>@file. They live here,
# not as labels on an app container, because labels vanish for every router as
# soon as that container stops. Same values as the labels of compose.prod.yml's
# traefik service: change both together.
http:
  middlewares:
    sec:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"
        # frame-ancestors only: the api answers JSON and files, a page policy means nothing there.
        # The page policies are sec-web (Report-Only) and sec-bo (the back office's own, enforcing).
        contentSecurityPolicy: "frame-ancestors 'none'"

    # sec for the web router (Angular SSR): the same headers plus a Report-Only page policy, to
    # watch what an enforcing one would block before turning it on (docs/DEPLOY.md). script-src
    # holds the hashes of the three STATIC inline scripts: the theme and session-marker scripts of
    # apps/web/src/index.html and Angular's event-replay contract (tied to the @angular/core
    # version; hash it again from the served page after an upgrade). The per-route
    # __jsaction_bootstrap script and the inline <style> blocks are dynamic, hence the reported
    # violations and 'unsafe-inline' on style-src; the fix is a per-response nonce (follow-up).
    # infra/tests/coolify-stack.test.sh recomputes the index.html hashes. Same value as the labels
    # of compose.prod.yml's traefik service: change both together.
    sec-web:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"
        contentSecurityPolicy: "frame-ancestors 'none'"
        customResponseHeaders:
          Content-Security-Policy-Report-Only: "default-src 'self'; script-src 'self' 'sha256-NEG1tnWqc501snI8MB3TOqvwZovStm53QzW/I51Z8es=' 'sha256-MCc6vC5mfuXJ3DCPWWh/xyOHuDIAMlEGgCJuqJMsoqY=' 'sha256-VM2mZqyEQZoLzoTrp5EigFvzQ0+f1wSeBuoOn95WHCg='; script-src-attr 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"

    # sec for the back office router. No contentSecurityPolicy on purpose: Traefik would
    # overwrite the one nginx sends, which is built at container start from BO_API_URL (the API is
    # another origin) and from the hashes of index.html's inline scripts
    # (apps/backoffice/docker/40-write-config.sh) and which includes frame-ancestors 'none'.
    sec-bo:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"

    # Drops the RFC 7239 Forwarded request header (an empty value removes a header). Traefik sets
    # X-Forwarded-* itself but would pass a client-sent Forwarded through, and Spring's forwarded-header
    # filter would then take the client address from it. Attached to every router that reaches the api.
    strip-forwarded:
      headers:
        customRequestHeaders:
          Forwarded: ""

    # Brute-force guard for login/refresh/register: 10 req/min per client IP.
    rl-auth:
      rateLimit:
        average: 10
        period: 1m
        burst: 5

    # Loose general guard for the rest of the API.
    rl-api:
      rateLimit:
        average: 30
        period: 1s
        burst: 100

    # 10 MB cap on uploads (matches the API's own multipart limit).
    upload-limit:
      buffering:
        maxRequestBodyBytes: 10485760
        memRequestBodyBytes: 1048576

    # Used by the plain-HTTP routers of compose.coolify.yml. Not named
    # redirect-to-https: Coolify's own dynamic file may already define that name.
    https-redirect:
      redirectScheme:
        scheme: https
        permanent: true
