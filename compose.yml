name: meetstudent

# Full local stack: Postgres + Spring Boot API + Angular SSR front, behind one
# origin like production: the `proxy` service answers on the front's port and
# sends /api and /uploads/public to the API, everything else to the web server.
# The browser bundle calls relative URLs, so without it every API call would
# land on the web server.
# Fully isolated from the cloud database — the data here is disposable.
#
#   cp .env.example .env   # then fill in the two secrets
#   docker compose up --build
#
#   front   http://localhost:4200
#   admin   http://localhost:4300  (back office, ADMIN accounts only)
#   api     http://localhost:8080/api/v1
#   swagger http://localhost:8080/swagger-ui.html

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meetstudent}
      POSTGRES_USER: ${POSTGRES_USER:-meetstudent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ expects the mount at /var/lib/postgresql, not .../data:
      # it stores data in a major-version subdirectory so pg_upgrade --link can
      # work across a single mount point. Mounting .../data aborts at startup.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meetstudent} -d ${POSTGRES_DB:-meetstudent}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - meetstudent

  api:
    build:
      context: ./apps/api
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Takes precedence over the localhost fallback in application-docker.yml.
      CUSTOM_DEV_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-meetstudent}
      POSTGRES_USER: ${POSTGRES_USER:-meetstudent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      # The front is same-origin behind `proxy`; the back office calls the API directly.
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-4200},http://localhost:${BO_PORT:-4300}
      # Media lives on named volumes so a rebuild does not wipe uploads.
      FILE_UPLOAD_DIR: /data/uploads
      FILE_PRIVATE_DIR: /data/private
    ports:
      - "8080:8080"
    volumes:
      - api-uploads:/data/uploads
      - api-private:/data/private
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /actuator/health is not permitAll in WebSecurityConfig and would answer
      # 401. This public endpoint goes through the DB, so a 200 means the schema
      # is migrated and the app is genuinely serving.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/v1/schools || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - meetstudent

  web:
    build:
      context: ./apps/web
    environment:
      PORT: 4200
      # Consumed by applyServerEnvironment() in src/server.ts: the SSR bundle
      # must reach the API over the compose network, not via localhost.
      API_URL: http://api:8080/api/v1
      SERVER_URL: http://api:8080
      # @angular/ssr renders only for hostnames on this list; anything else
      # silently degrades to client-side rendering.
      ALLOWED_HOSTS: localhost,web
    # Not published: the browser reaches it through `proxy`.
    expose:
      - "4200"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - meetstudent

  backoffice:
    build:
      context: ./apps/backoffice
      args:
        DIST_DIR: dist/backoffice/browser
    environment:
      # Rendered into /config.json at container start; the browser calls it directly.
      BO_API_URL: http://localhost:8080/api/v1
    ports:
      - "${BO_PORT:-4300}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - meetstudent

  proxy:
    image: traefik:v3.6
    command:
      - --entryPoints.web.address=:80
      - --providers.file.filename=/etc/traefik/routes.yml
      - --api.dashboard=false
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
    configs:
      - source: proxy-routes
        target: /etc/traefik/routes.yml
    ports:
      - "${WEB_PORT:-4200}:80"
    depends_on:
      - api
      - web
    networks:
      - meetstudent

# Same split as compose.prod.yml, without TLS, rate limits or the Docker socket.
configs:
  proxy-routes:
    content: |
      http:
        routers:
          api:
            rule: PathPrefix(`/api`) || PathPrefix(`/uploads/public`)
            service: api
          web:
            rule: PathPrefix(`/`)
            service: web
        services:
          api:
            loadBalancer:
              servers:
                - url: http://api:8080
          web:
            loadBalancer:
              servers:
                - url: http://web:4200

volumes:
  pgdata:
  api-uploads:
  api-private:

networks:
  meetstudent:
    driver: bridge
