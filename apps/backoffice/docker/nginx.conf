server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Content-Security-Policy (enforcing), rendered at container start by
    # 40-write-config.sh. nginx drops the add_header lines of the enclosing level as soon as a
    # location declares its own, so every location includes the file again.

    # Runtime config: never cache, so a changed BO_API_URL applies immediately.
    location = /config.json {
        include /tmp/bo-csp.conf;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Fingerprinted build assets can be cached for a year.
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico|webp)$ {
        include /tmp/bo-csp.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback; index.html itself must always be revalidated.
    location / {
        include /tmp/bo-csp.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
