server:
  # TLS terminates at a reverse proxy: honour X-Forwarded-* so redirects/links use https. "native" is Tomcat's
  # RemoteIpValve, which acts only when the socket peer matches internal-proxies (Spring's "framework" filter has no
  # such check: any peer could set the client address). The RFC 7239 Forwarded header is ignored by the valve.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Regex of the peers allowed to speak for a client: the reverse proxy. Default: loopback and private ranges
      # (a Docker network where the proxy is the only other container). Narrow it to the proxy's own network
      # when other containers can reach the API (compose.coolify.yml does), see docs/production.md.
      internal-proxies: ${TRUSTED_PROXIES:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[0-1])\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    show-sql: false

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  # No localhost default in production. Only checked when MAIL_ENABLED=true (https required then).
  frontend-base-url: ${FRONTEND_BASE_URL:}
  mail:
    dev-log: false
  contact:
    # Off: the RemoteIpValve (server.tomcat.remoteip) puts the client address in getRemoteAddr() when, and only
    # when, the peer is a trusted proxy. Reading the raw X-Forwarded-For header here would trust any peer.
    trust-forwarded-for: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.bowe.meetstudent: INFO
