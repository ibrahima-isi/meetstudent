server:
  # TLS terminates at a reverse proxy: honour X-Forwarded-* so redirects/links use https.
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    show-sql: false

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  # Consumed by AdminBootstrapRunner, which refuses to start without them (password >= 12 chars).
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  # No localhost default in production. Only checked when MAIL_ENABLED=true (https required then).
  frontend-base-url: ${FRONTEND_BASE_URL:}
  mail:
    dev-log: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.bowe.meetstudent: INFO
