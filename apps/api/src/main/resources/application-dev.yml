spring:
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java
      exclude: META-INF/resources/**,static/**,public/**

  datasource:
    # Prioritize Neon/External URL from .env, fallback to local docker-mapped port
    url: ${CUSTOM_DEV_DB_URL:jdbc:postgresql://localhost:5433/meetstudent}
    username: ${POSTGRES_USER:ibrahima}
    password: ${POSTGRES_PASSWORD:changeMeInProd!}
    hikari:
      auto-commit: false
      connection-timeout: 30000
  
  jpa:
    # Flyway owns the schema. `update` let Hibernate alter it behind Flyway's
    # back, so dev silently drifted away from docker/prod/test, which all
    # validate. Inherited from application.yml now.
    show-sql: true
    properties:
      hibernate:
        connection:
          autocommit: false

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY:devSecretKeyForLocalOnly!1234567890}
