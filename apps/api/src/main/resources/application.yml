spring:
  application:
    name: meetstudent
  profiles:
    active: dev
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    enabled: true
  task:
    execution:
      # Keep Boot's applicationTaskExecutor even though MailConfig defines the mailExecutor bean.
      mode: force
  mail:
    # Host, port, credentials come from SPRING_MAIL_HOST/PORT/USERNAME/PASSWORD and
    # SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH / ..._STARTTLS_ENABLE. Nothing is set here, so an
    # unconfigured deployment has no mail sender and boots normally.
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

security:
  jwt:
    # Access token lifetime; the web client refreshes on 401.
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:60}

springdoc:
  show-actuator: true

file:
  # Overridable so containers can point at mounted volumes; the defaults keep
  # `./mvnw spring-boot:run` working from the project directory.
  upload-dir: ${FILE_UPLOAD_DIR:uploads}
  private-dir: ${FILE_PRIVATE_DIR:storage/private}
  max-upload-bytes: 10485760

app:
  # Consumed by AdminBootstrapRunner: mandatory under prod (password >= 12 chars), optional under
  # dev/docker, where leaving both empty keeps the seeded development admin.
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  # Origin of the web app: the only source of the links in emails (never the request Host).
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:}
    # brevo | gmail | ses | custom. A preset only supplies DEFAULTS for the SMTP connection (host, port, auth,
    # mandatory STARTTLS); any explicit SPRING_MAIL_* variable wins. See MailProviderEnvironmentPostProcessor.
    provider: ${MAIL_PROVIDER:custom}
    # AWS region of the SES SMTP endpoint (ses preset only).
    ses-region: ${MAIL_SES_REGION:eu-west-1}
    # Seconds between two SMTP self-tests (POST /api/v1/admin/mail/test) of the same admin; 0 = no limit.
    test-cooldown-seconds: 10
    # Local development only; the prod profile refuses to start with it.
    dev-log: false
    async: true
  contact:
    # Contact mail delivery: retry of transient failures (connection, TLS, unknown) inside the background
    # listener. Permanent failures (bad credentials, refused address) are never retried.
    mail:
      # A message PENDING for longer than this can be resent again (a double click is refused with 409 before).
      pending-timeout: ${APP_CONTACT_MAIL_PENDING_TIMEOUT:15m}
      retry:
        max-attempts: ${APP_CONTACT_MAIL_RETRY_MAX_ATTEMPTS:3}
        initial-delay: ${APP_CONTACT_MAIL_RETRY_INITIAL_DELAY:2s}
        backoff-multiplier: ${APP_CONTACT_MAIL_RETRY_BACKOFF_MULTIPLIER:5}
    # Where contact-form messages are mailed; distinct from the address shown on the site.
    recipient: ${CONTACT_RECIPIENT:contact@meetstudent.com}
    # First X-Forwarded-For hop as client IP: only behind a proxy that rewrites it (prod profile).
    trust-forwarded-for: false
    rate-limit:
      max-per-window: 5
      window-minutes: 60
      max-tracked-clients: 10000
  forum:
    # Messages (threads and replies together) per user and sliding window; beyond it: 429 + Retry-After.
    rate-limit:
      max-per-window: 5
      window-seconds: 60
      max-tracked-users: 10000
  tokens:
    reset-ttl-minutes: 60
    verify-ttl-hours: 24
    cooldown-seconds: 60
    max-per-day: 5
    max-per-address-per-day: 3

management:
  health:
    # The health endpoint must not open an SMTP connection.
    mail:
      enabled: false

logging:
  level:
    root: INFO
    com.bowe.meetstudent: DEBUG
