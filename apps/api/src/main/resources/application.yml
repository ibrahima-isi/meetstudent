spring:
  application:
    name: meetstudent
  profiles:
    active: dev
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

springdoc:
  show-actuator: true

file:
  # Overridable so containers can point at mounted volumes; the defaults keep
  # `./mvnw spring-boot:run` working from the project directory.
  upload-dir: ${FILE_UPLOAD_DIR:uploads}
  private-dir: ${FILE_PRIVATE_DIR:storage/private}
  max-upload-bytes: 10485760

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging:
  level:
    root: INFO
    com.bowe.meetstudent: DEBUG
