name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel superseded runs on the same branch/PR to save runner minutes, except
# on main: a run there carries the deploy, which must never stop mid-push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only token for every job; only deploy widens it (packages: write).
permissions:
  contents: read

jobs:
  # Tells whether a pull request touches the API. HEAD is the merge commit
  # GitHub checks out for a PR, so HEAD^1..HEAD is exactly what the PR changes
  # against the current base. Pushes always answer true. Not a required check.
  changes:
    name: changes / detect
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Detect API changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            api=true
          elif changed="$(git diff --name-only HEAD^1 HEAD)"; then
            if grep -qE '^(apps/api/|\.github/workflows/ci\.yml$)' <<<"$changed"; then api=true; else api=false; fi
          else
            api=true
          fi
          echo "api=$api" >> "$GITHUB_OUTPUT"

  # The published check name is the job's `name:`, not its id — branch
  # protection matches on that string, so keep the two in sync with the
  # required contexts configured on main/dev.
  api:
    name: api / build-and-test
    runs-on: ubuntu-latest
    # Skipped (which satisfies the required check) only when the filter answers
    # false; a failed or silent filter runs the tests.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.api != 'false' }}

    # Throwaway PostgreSQL for the *MigrationPostgresIntegrationTests classes: they replay every Flyway
    # migration on the real engine (they wipe the schema) and are skipped when MIGRATION_PG_URL is absent.
    # Same major version as compose.yml. Published on 55432, not 5432: the tests refuse to wipe port 5432.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mig
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mig"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      - name: Build
        run: ./mvnw --batch-mode clean compile

      - name: Run unit and integration tests
        run: ./mvnw --batch-mode verify
        env:
          MIGRATION_PG_URL: jdbc:postgresql://127.0.0.1:55432/mig
          MIGRATION_PG_USER: postgres
          MIGRATION_PG_PASSWORD: postgres

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-api
          path: |
            apps/api/target/surefire-reports/
            apps/api/target/failsafe-reports/
          retention-days: 7

  web:
    name: web / build-and-test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (production, SSR)
        run: npm run build

      - name: Run unit tests
        run: npm test -- --no-watch --browsers=ChromeHeadless

  backoffice:
    name: backoffice / build-and-test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/backoffice

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/backoffice/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npm run build

      - name: Run unit tests
        run: npm test -- --no-watch --browsers=ChromeHeadless

  # Production images (coolify-deploy/01, ADR 0003): the list of images, their
  # tags and platform live in infra/docker-bake.hcl. Neither job below is a required
  # check; keep their names distinct from the build-and-test ones.
  images:
    name: images / build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the production images (no push)
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: infra/docker-bake.hcl
          push: false

  # Runs only when dev is promoted to main, once the three test jobs are green.
  # The `production` environment holds the deploy secrets (coolify-deploy/04).
  deploy:
    name: deploy / production
    needs: [api, web, backoffice]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # A hung push or webhook must not hold the deploy queue for GitHub's 6 hours.
    timeout-minutes: 30
    # Deploys queue one after another; a newer one never cancels a running one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags sha-<full commit SHA> and latest (infra/docker-bake.hcl reads GITHUB_SHA).
      - name: Build and push the production images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: infra/docker-bake.hcl
          push: true

      # The only deploy trigger (Coolify's auto deploy stays off): the resource's
      # "Deploy Webhook (auth required)". Secrets of the `production` environment,
      # passed by env, never echoed. Any answer but 2xx fails the run: --fail for
      # 4xx/5xx, and a redirect (which deploys nothing) is refused, not followed;
      # an answer that never comes fails it after 60 s. POST: since v4.5 Coolify
      # answers a GET on /api/v1/deploy with 405.
      - name: Ask Coolify to deploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
        run: |
          curl -fsS -L --max-redirs 0 --max-time 60 -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"

  # Renders compose.coolify.yml with dummy variables and checks what the Coolify
  # stack guarantees (no published port, GHCR images, isolated Postgres...).
  # Not a required check. The live half (the stack behind a replica of Coolify's
  # Traefik) needs the images locally: infra/tests/coolify-stack.test.sh live.
  compose:
    name: compose / validate-coolify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate compose.coolify.yml
        run: infra/tests/coolify-stack.test.sh static

      # Every variable of the stack and secret of the deploy job is in the guide.
      - name: Check the Coolify deployment guide
        run: infra/tests/deploy-docs.test.sh
