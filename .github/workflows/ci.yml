name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel superseded runs on the same branch/PR to save runner minutes, except
# on main: a run there carries the deploy, which must never stop mid-push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only token for every job; only deploy widens it (packages: write).
permissions:
  contents: read

jobs:
  # The published check name is the job's `name:`, not its id — branch
  # protection matches on that string, so keep the two in sync with the
  # required contexts configured on main/dev.
  api:
    name: api / build-and-test
    runs-on: ubuntu-latest

    # Throwaway PostgreSQL for the *MigrationPostgresIntegrationTests classes: they replay every Flyway
    # migration on the real engine (they wipe the schema) and are skipped when MIGRATION_PG_URL is absent.
    # Same major version as compose.yml. Published on 55432, not 5432: the tests refuse to wipe port 5432.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mig
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mig"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      - name: Build
        run: ./mvnw --batch-mode clean compile

      - name: Run unit and integration tests
        run: ./mvnw --batch-mode verify
        env:
          MIGRATION_PG_URL: jdbc:postgresql://127.0.0.1:55432/mig
          MIGRATION_PG_USER: postgres
          MIGRATION_PG_PASSWORD: postgres

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports-api
          path: |
            apps/api/target/surefire-reports/
            apps/api/target/failsafe-reports/
          retention-days: 7

  web:
    name: web / build-and-test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (production, SSR)
        run: npm run build

      - name: Run unit tests
        run: npm test -- --no-watch --browsers=ChromeHeadless

  backoffice:
    name: backoffice / build-and-test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/backoffice

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/backoffice/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npm run build

      - name: Run unit tests
        run: npm test -- --no-watch --browsers=ChromeHeadless

  # Production images (coolify-deploy/01, ADR 0003): the list of images, their
  # tags and platform live in infra/docker-bake.hcl. Neither job below is a required
  # check; keep their names distinct from the build-and-test ones.
  images:
    name: images / build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build the production images (no push)
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6.10.0
        with:
          source: .
          files: infra/docker-bake.hcl
          push: false

  # Runs only when dev is promoted to main, once the three test jobs are green.
  # The `production` environment holds the deploy secrets (coolify-deploy/04).
  deploy:
    name: deploy / production
    needs: [api, web, backoffice]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # A hung push or webhook must not hold the deploy queue for GitHub's 6 hours.
    timeout-minutes: 30
    # Deploys queue one after another; a newer one never cancels a running one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags sha-<full commit SHA> and latest (infra/docker-bake.hcl reads GITHUB_SHA).
      - name: Build and push the production images
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6.10.0
        with:
          source: .
          files: infra/docker-bake.hcl
          push: true

      # The only deploy trigger (Coolify's auto deploy stays off): the resource's
      # "Deploy Webhook (auth required)". Secrets of the `production` environment,
      # passed by env, never echoed. Any answer but 2xx fails the run: --fail for
      # 4xx/5xx, and a redirect (which deploys nothing) is refused, not followed;
      # an answer that never comes fails it after 60 s.
      - name: Ask Coolify to deploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
        run: |
          curl -fsS -L --max-redirs 0 --max-time 60 -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"

  # Renders compose.coolify.yml with dummy variables and checks what the Coolify
  # stack guarantees (no published port, GHCR images, isolated Postgres...).
  # Not a required check. The live half (the stack behind a replica of Coolify's
  # Traefik) needs the images locally: infra/tests/coolify-stack.test.sh live.
  compose:
    name: compose / validate-coolify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate compose.coolify.yml
        run: infra/tests/coolify-stack.test.sh static

      # Every variable of the stack and secret of the deploy job is in the guide.
      - name: Check the Coolify deployment guide
        run: infra/tests/deploy-docs.test.sh
