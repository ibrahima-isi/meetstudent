# Preserve the dependency update groups and commit conventions.
# A zero limit pauses scheduled version-update PRs under GitHub Flow.
# GitHub controls Dependabot security-update PRs separately.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Patch/minor bumps only, one grouped PR per app; majors are done by hand.
  - package-ecosystem: npm
    directory: /apps/web
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(web)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      web-patch-minor:
        update-types: ["minor", "patch"]

  # Patch/minor bumps only, one grouped PR per app; majors are done by hand.
  - package-ecosystem: npm
    directory: /apps/backoffice
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(backoffice)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      backoffice-patch-minor:
        update-types: ["minor", "patch"]

  # Patch/minor bumps only, one grouped PR per app; majors are done by hand.
  - package-ecosystem: maven
    directory: /apps/api
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(api)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      api-patch-minor:
        update-types: ["minor", "patch"]
