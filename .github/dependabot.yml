# Keeps the actions of .github/workflows/ci.yml up to date. They are pinned to a
# commit SHA with a `# vX.Y.Z` comment; Dependabot bumps both, in a PR to dev
# (main only receives dev's promotion). Tested by infra/tests/ci-images.test.sh.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Patch/minor bumps only, one grouped PR per app; majors are done by hand.
  - package-ecosystem: npm
    directory: /apps/web
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(web)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      web-patch-minor:
        update-types: ["minor", "patch"]

  # Patch/minor bumps only, one grouped PR per app; majors are done by hand.
  - package-ecosystem: npm
    directory: /apps/backoffice
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(backoffice)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      backoffice-patch-minor:
        update-types: ["minor", "patch"]

  # Patch/minor bumps only, one grouped PR per app; majors are done by hand.
  - package-ecosystem: maven
    directory: /apps/api
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(api)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      api-patch-minor:
        update-types: ["minor", "patch"]
